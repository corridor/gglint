# Publishes gglint to PyPI when a GitHub release is published.
#
# To release: bump `version` in Cargo.toml, merge to main, then publish a GitHub release
# tagged `v<version>` (for example `v0.1.0`). This workflow runs CI, publishes the wheels
# and source distribution to PyPI, and attaches them to the release.
#
# PyPI accepts the upload through trusted publishing: the project trusts this workflow
# file in corridor/gglint, run in the `pypi` environment, so no API token is stored here.
# Renaming this file or the environment means updating the publisher on PyPI too.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release is tagged $TAG, but Cargo.toml says version $version. Tag it v$version."
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  pypi:
    name: Publish to PyPI
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gglint/
    permissions:
      # Trusted publishing, and the attestations PyPI stores with each file.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  assets:
    name: Attach files to the release
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Upload the wheels and source distribution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
