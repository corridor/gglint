# Publishes gglint to PyPI and npm when a GitHub release is published.
#
# To release: bump `version` in Cargo.toml, merge to main, then publish a GitHub release
# tagged `v<version>` (for example `v0.1.0`). This workflow runs CI, publishes the wheels
# and source distribution to PyPI, publishes the npm packages built from the same programs,
# and attaches the wheels to the release.
#
# PyPI and npm accept the uploads through trusted publishing: each package trusts this
# workflow file in corridor/gglint, run in the `pypi` or `npm` environment, so no token is
# stored here. Renaming this file or an environment means updating the publishers too.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release is tagged $TAG, but Cargo.toml says version $version. Tag it v$version."
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  pypi:
    name: Publish to PyPI
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gglint/
    permissions:
      # Trusted publishing, and the attestations PyPI stores with each file.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/gglint
    permissions:
      contents: read
      # Trusted publishing, and the provenance npm shows with each package.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Build the packages from the wheels
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python npm/build.py --version "${TAG#v}" --wheels dist --out "$RUNNER_TEMP/npm" > "$RUNNER_TEMP/npm-packages"
      - name: Publish each package, the platforms' first
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          while read -r folder; do
            name=$(node -p "require('$folder/package.json').name")
            # A retried run skips what an earlier attempt published.
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$folder" --access public
            fi
          done < "$RUNNER_TEMP/npm-packages"

  assets:
    name: Attach files to the release
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Upload the wheels and source distribution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
