# Lints and tests the code, builds the wheels and source distribution that are published to
# PyPI, and tests the npm packages built from the same program. Runs on every push to main
# and every pull request, and is called by pypi_release.yml when a release is published.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- --deny warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The action runs `uvx gglint@<version>` from PyPI. Here it runs this build instead, so
      # the action is tested with the code in the pull request. Job variables reach the
      # steps of a composite action.
      GGLINT_BIN: ${{ github.workspace }}/target/debug/gglint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Set up one repository with a secret and one without
        run: |
          mkdir -p "$RUNNER_TEMP/dirty/.cursor" "$RUNNER_TEMP/clean"
          # A token's shape, assembled here so no file in the repository looks like one.
          token="ghp_$(printf '%s%s' aB3dE6gH9jK2mN5pQ8sT1vW4yZ7 aB3dE6gH9)"
          printf '{"mcpServers":{"github":{"url":"https://x","headers":{"Authorization":"Bearer %s"}}}}\n' "$token" > "$RUNNER_TEMP/dirty/.cursor/mcp.json"
          printf '{"mcpServers":{}}\n' > "$RUNNER_TEMP/clean/.mcp.json"
      - name: Report a secret without failing
        uses: ./
        with:
          command: secrets
          path: ${{ runner.temp }}/dirty
          comment: "false"
          fail-on-problems: "false"
      - name: Fail on a secret
        id: fails
        uses: ./
        continue-on-error: true
        with:
          command: secrets
          path: ${{ runner.temp }}/dirty
          comment: "false"
      - name: Check that it failed
        run: test "${{ steps.fails.outcome }}" = failure
      - name: Pass on a repository without problems
        uses: ./
        with:
          command: all
          path: ${{ runner.temp }}/clean
          comment: "false"

  npm:
    name: npm package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build --locked
      - name: Build the npm packages for this machine
        shell: bash
        run: |
          platform=$(node -p 'process.platform + "-" + process.arch')
          program=target/debug/gglint
          if [ "$RUNNER_OS" = Windows ]; then program=target/debug/gglint.exe; fi
          python npm/build.py --version 0.0.0-ci --out "$RUNNER_TEMP/npm" --binary "$platform=$program"
      - name: Install them with npm and pnpm, and run gglint
        shell: bash
        run: |
          cd "$RUNNER_TEMP/npm"
          for package in gglint cli-*; do (cd "$package" && npm pack --pack-destination ..); done
          # A token's shape, assembled here so no file in the repository looks like one.
          token="ghp_$(printf '%s%s' aB3dE6gH9jK2mN5pQ8sT1vW4yZ7 aB3dE6gH9)"
          mkdir -p dirty/.cursor clean
          printf '{"mcpServers":{"github":{"url":"https://x","headers":{"Authorization":"Bearer %s"}}}}\n' "$token" > dirty/.cursor/mcp.json

          mkdir npm-project && cd npm-project
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../gglint-cli-*.tgz ../gglint-0.0.0-ci.tgz
          npx gglint --version
          # gglint's exit code comes through: 1 for a secret, 0 for none.
          if npx gglint secrets ../dirty; then echo "gglint passed a file with a secret"; exit 1; fi
          npx gglint secrets ../clean

          npm install --global pnpm@10
          mkdir ../pnpm-project && cd ../pnpm-project
          printf '{"name":"test","version":"1.0.0"}\n' > package.json
          pnpm add ../gglint-cli-*.tgz ../gglint-0.0.0-ci.tgz
          pnpm exec gglint --version

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  wheels:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `native: true` means the runner can install and run the wheel it built.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, native: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, native: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, native: false }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, native: false }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64, native: false }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, native: true }
          - { name: windows-x64, runner: windows-latest, target: x64, native: true }
          - { name: windows-arm64, runner: windows-latest, target: aarch64, native: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Install and run the wheel
        if: matrix.native
        shell: bash
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
          "$bin/python" -m pip install --no-index --find-links dist gglint
          "$bin/gglint" --version
          "$bin/gglint" --help
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error
