[package]
name = "gglint"
version = "0.4.5"
edition = "2024"
rust-version = "1.88"
description = "Keep the MCP servers of Claude Code, Codex, Cursor, Gemini CLI and other coding agents in sync, and secrets out of their config files"
readme = "README.md"
homepage = "https://github.com/corridor/gglint"
repository = "https://github.com/corridor/gglint"
license = "Apache-2.0"
keywords = ["mcp", "claude-code", "codex", "cursor", "opencode"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
memchr = "2"
# The coding agents' config files: JSON with comments, and TOML. Both keep each key's
# position, for reporting lines. `cst` and `toml_edit` change a file and keep its comments
# and formatting, for `gglint mcp --fix`. MIT, and MIT or Apache-2.0.
jsonc-parser = { version = "=0.34.0", features = ["cst"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "std"] }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display"] }
# Continue's MCP servers, in YAML files: read only, as gglint adds a server to a file of its
# own. MIT or Apache-2.0.
yaml-rust2 = { version = "=0.13.0", default-features = false }

# The binary that ships in the wheels: smaller and a little faster, at the cost of a longer
# release build.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
# Matches the pre-commit hook's `files` pattern in a test. MIT or Apache-2.0.
regex-lite = "=0.1.9"
