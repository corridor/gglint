[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gglint"
description = "Finds the AI agents defined in Python source code"
requires-python = ">=3.11"
license = "Apache-2.0"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
bindings = "pyo3"
features = ["python", "pyo3/extension-module"]

[tool.uv]
# Rebuild the extension whenever its Rust source changes, on the next `uv sync` or `uv run`
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]
