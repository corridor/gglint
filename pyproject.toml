[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gglint"
description = "Keeps the MCP servers of Claude Code, Codex, Cursor and OpenCode in sync"
requires-python = ">=3.11"
license = "Apache-2.0"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# The wheel holds the `gglint` program itself; there is no Python module to import.
bindings = "bin"

[tool.uv]
# Rebuild the extension whenever its Rust source changes, on the next `uv sync` or `uv run`
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]
